<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor Dashboard — evidence, sources, graph</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --line: #232b36; --ink: #dbe2ea;
    --dim: #7d8894; --accent: #f5a623; --ok: #4cc38a; --bad: #e5534b;
    --protein: #f5a623; --gene: #4cc38a; --disease: #e5534b;
    --structure: #58a6ff; --sequence: #b083f0; --organism: #d29922;
    --location: #39c5cf; --domain: #ff9bce; --claim: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, "SF Pro Text", sans-serif; height: 100vh;
         display: grid; grid-template-rows: auto 1fr;
         grid-template-columns: 320px 1fr 380px;
         grid-template-areas: "top top top" "left graph right"; }
  header { grid-area: top; display: flex; align-items: baseline; gap: 14px;
           padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  aside, section.detail { overflow-y: auto; padding: 14px; }
  aside { grid-area: left; border-right: 1px solid var(--line); }
  section.detail { grid-area: right; border-left: 1px solid var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--dim); margin-bottom: 8px; }
  .kv { display: flex; justify-content: space-between; padding: 2px 0; font-size: 13px; }
  .kv b { font-variant-numeric: tabular-nums; }
  .src { padding: 8px 0; border-top: 1px solid var(--line); }
  .src:first-of-type { border-top: 0; }
  .src .name { font-weight: 700; }
  .src .host, .src .when { color: var(--dim); font-size: 12px; }
  .dbrow { cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  .dbrow:hover { background: #1c232d; }
  .dbrow.active { background: #232d3a; outline: 1px solid var(--accent); }
  .dbrow .path { color: var(--dim); font-size: 11px; word-break: break-all; }
  main { grid-area: graph; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #legend { position: absolute; left: 12px; bottom: 12px; background: #161b23cc;
            border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
            font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px; max-width: 60%; }
  .lg { display: flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .edge-row { border-top: 1px solid var(--line); padding: 7px 0; font-size: 13px; }
  .edge-row .rel { color: var(--accent); }
  .edge-row a { color: var(--structure); font-size: 12px; word-break: break-all;
                text-decoration: none; }
  .edge-row a:hover { text-decoration: underline; }
  .edge-row .when { color: var(--dim); font-size: 11px; }
  .tile { border-left: 3px solid var(--accent); padding: 4px 8px; margin: 6px 0;
          background: #1a212b; border-radius: 0 6px 6px 0; font-size: 13px; }
  .empty { color: var(--dim); font-style: italic; }
  .trunc { color: var(--bad); font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tab { padding: 4px 12px; border-radius: 6px 6px 0 0; cursor: pointer;
         color: var(--dim); border: 1px solid transparent; background: none;
         font: inherit; }
  .tab.active { color: var(--ink); background: var(--panel);
                border-color: var(--line); border-bottom-color: var(--panel); }
  input[type=text], input[type=date] { background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  #nodesearch { width: 210px; }
  #ledgerview { grid-area: graph; overflow-y: auto; padding: 14px; display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .chip { display: inline-block; background: #1c232d; border: 1px solid var(--line);
          border-radius: 12px; padding: 2px 10px; font-size: 12px; cursor: pointer; margin: 2px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ledger th { text-align: left; color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  table.ledger td { padding: 6px 8px; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  table.ledger td.when { white-space: nowrap; font-variant-numeric: tabular-nums;
    color: var(--dim); }
  .kind { font-size: 11px; padding: 1px 7px; border-radius: 9px; font-weight: 700; }
  .kind-edge { background: #2b3f2f; color: var(--ok); }
  .kind-claim { background: #3d3427; color: var(--accent); }
  .kind-node { background: #253244; color: var(--structure); }
  .kind-sequence { background: #362a44; color: var(--sequence); }
  .kind-tile { background: #2a2f36; color: var(--dim); }
  td a { color: var(--structure); text-decoration: none; font-size: 12px; word-break: break-all; }
  td a:hover { text-decoration: underline; }
  .btn { background: var(--panel); border: 1px solid var(--line); color: var(--ink);
         border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🧬 <span>floor</span> dashboard</h1>
  <span class="sub">read-only · every edge carries its receipt</span>
  <select id="dbsel"></select>
  <nav class="tabs">
    <button class="tab active" id="tab-graph">Graph</button>
    <button class="tab" id="tab-ledger">Ledger</button>
  </nav>
  <input type="text" id="nodesearch" placeholder="find node… (e.g. P69905)" list="nodelist">
  <datalist id="nodelist"></datalist>
  <span class="sub" id="dbstat"></span>
</header>

<aside>
  <div class="card"><h2>Where the data is</h2><div id="dbs"></div></div>
  <div class="card"><h2>Where it was collected from</h2><div id="sources"></div></div>
</aside>

<main id="graphview"><canvas id="cv"></canvas><div id="legend"></div></main>

<div id="ledgerview">
  <div class="filters">
    <input type="text" id="lq" placeholder="search text…">
    <input type="date" id="lfrom"> <span class="sub">→</span> <input type="date" id="lto">
    <button class="btn" id="lgo">Query</button>
    <button class="btn" id="lclear">Clear</button>
    <span style="flex:1"></span>
    <button class="btn" id="lcsv">⬇ CSV</button>
    <button class="btn" id="ljson">⬇ JSON</button>
  </div>
  <div id="lfacets"></div>
  <div class="sub" id="lcount" style="margin:6px 0"></div>
  <table class="ledger">
    <thead><tr><th>When (stored)</th><th>Kind</th><th>Event</th>
      <th>Collected from</th><th>Retrieved</th></tr></thead>
    <tbody id="lrows"></tbody>
  </table>
  <div style="margin:10px 0"><button class="btn" id="lmore">Load more</button></div>
</div>

<section class="detail">
  <div class="card"><h2>Node</h2><div id="node"><span class="empty">click a node in the graph</span></div></div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const api = (path, params) =>
  fetch(path + "?" + new URLSearchParams(params)).then(r => r.json());

const COLORS = { protein: "#f5a623", gene: "#4cc38a", disease: "#e5534b",
  structure: "#58a6ff", sequence: "#b083f0", organism: "#d29922",
  location: "#39c5cf", domain: "#ff9bce", claim: "#8b949e", peel: "#8b949e" };
const color = t => COLORS[t] || "#8b949e";
const fmtBytes = n => n > 1048576 ? (n/1048576).toFixed(1)+" MB" : (n/1024).toFixed(0)+" KB";
const short = id => { const [t, v] = id.split(/:(.*)/s);
  return v && v.length > 22 ? t + ":" + v.slice(0, 8) + "…" + v.slice(-6) : id; };

let state = { db: null, nodes: [], edges: [], sel: null, drag: null };

/* ---------- left panel ---------- */
async function loadDbs() {
  const data = await api("/api/dbs", {});
  const box = $("dbs"), sel = $("dbsel");
  box.innerHTML = ""; sel.innerHTML = "";
  for (const db of data.dbs) {
    sel.add(new Option(db.name, db.name));
    const row = document.createElement("div");
    row.className = "dbrow"; row.dataset.name = db.name;
    row.innerHTML = `<b>${db.name}</b> · ${db.edges} edges · ${db.nodes} nodes ·
      ${db.tiles} tiles · ${fmtBytes(db.size_bytes)}
      <div class="path">${db.path}</div>`;
    row.onclick = () => pick(db.name);
    box.appendChild(row);
  }
  const want = new URLSearchParams(location.search).get("db");
  if (data.dbs.length)
    pick(want && data.dbs.some(d => d.name === want) ? want
         : (state.db || data.dbs[0].name));
  else box.innerHTML = '<span class="empty">no floor DBs found</span>';
}

async function pick(name) {
  state.db = name; $("dbsel").value = name;
  document.querySelectorAll(".dbrow").forEach(r =>
    r.classList.toggle("active", r.dataset.name === name));
  const [srcs, g] = await Promise.all([
    api("/api/sources", { db: name }), api("/api/graph", { db: name })]);
  renderSources(srcs); startGraph(g);
  $("dbstat").textContent = `${g.edges.length} edges` +
    (g.truncated ? ` (capped at ${g.edge_cap})` : "");
  $("node").innerHTML = '<span class="empty">click a node in the graph</span>';
  if ($("tab-ledger").classList.contains("active")) runLedger(true);
  const deep = new URLSearchParams(location.search).get("node");
  if (deep) {
    const hit = state.nodes.find(n => n.id === deep);
    if (hit) { state.sel = hit; showNode(hit.id); }
  }
}

function renderSources(data) {
  const box = $("sources");
  if (!data.sources.length) { box.innerHTML = '<span class="empty">no provenance rows</span>'; return; }
  box.innerHTML = data.sources.map(s => `
    <div class="src">
      <div class="name">${s.source} <b style="float:right">${s.edges}</b></div>
      <div class="host">${Object.entries(s.hosts).map(([h,c]) => `${h} (${c})`).join(" · ")}</div>
      <div class="when">${(s.first_retrieved||"").slice(0,19)} → ${(s.last_retrieved||"").slice(0,19)}</div>
    </div>`).join("");
}

/* ---------- graph: tiny force layout, no deps ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
function startGraph(g) {
  const idx = new Map();
  state.nodes = g.nodes.map((n, i) => { idx.set(n.id, i); return {
    ...n, x: Math.cos(i*2.399)*(120+8*Math.sqrt(i)) ,
    y: Math.sin(i*2.399)*(120+8*Math.sqrt(i)), vx: 0, vy: 0 }; });
  state.edges = g.edges.map(e => ({ ...e, si: idx.get(e.source), ti: idx.get(e.target) }));
  const degree = new Array(state.nodes.length).fill(0);
  state.edges.forEach(e => { degree[e.si]++; degree[e.ti]++; });
  state.nodes.forEach((n, i) => n.r = 5 + Math.min(11, Math.sqrt(degree[i]) * 2.2));
  state.sel = null;
  const types = [...new Set(state.nodes.map(n => n.type))];
  $("legend").innerHTML = types.map(t =>
    `<span class="lg"><span class="dot" style="background:${color(t)}"></span>${t}</span>`).join("");
}

function step() {
  const N = state.nodes, E = state.edges;
  for (let i = 0; i < N.length; i++) for (let j = i+1; j < N.length; j++) {
    const a = N[i], b = N[j];
    let dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx*dx + dy*dy || 1;
    if (d2 < 40000) { const f = 900 / d2;
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f; }
  }
  for (const e of E) {
    const a = N[e.si], b = N[e.ti];
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1, f = (d - 90) * 0.004;
    a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
  }
  for (const n of N) {
    if (n === state.drag) continue;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
    n.x -= n.x * 0.002; n.y -= n.y * 0.002;   // gentle centering
  }
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*devicePixelRatio) { cv.width = w*devicePixelRatio; cv.height = h*devicePixelRatio; }
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.save(); ctx.translate(w/2, h/2);
  ctx.strokeStyle = "#2c3644"; ctx.lineWidth = 1;
  for (const e of state.edges) {
    const a = state.nodes[e.si], b = state.nodes[e.ti];
    if (!a || !b) continue;
    const hot = state.sel && (a === state.sel || b === state.sel);
    ctx.strokeStyle = hot ? "#f5a623" : "#2c3644";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const n of state.nodes) {
    ctx.fillStyle = color(n.type);
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    if (n === state.sel) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    if (n.r > 7 || n === state.sel) {
      ctx.fillStyle = "#dbe2ea"; ctx.font = "11px sans-serif";
      ctx.fillText(short(n.id), n.x + n.r + 3, n.y + 3);
    }
  }
  ctx.restore();
  step(); requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function nodeAt(mx, my) {
  const w = cv.clientWidth, h = cv.clientHeight;
  const x = mx - w/2, y = my - h/2;
  for (let i = state.nodes.length - 1; i >= 0; i--) {
    const n = state.nodes[i], dx = n.x - x, dy = n.y - y;
    if (dx*dx + dy*dy <= (n.r+3)*(n.r+3)) return n;
  }
  return null;
}
cv.addEventListener("mousedown", ev => {
  const r = cv.getBoundingClientRect();
  const n = nodeAt(ev.clientX - r.left, ev.clientY - r.top);
  if (n) { state.drag = n; }
});
cv.addEventListener("mousemove", ev => {
  const r = cv.getBoundingClientRect();
  if (state.drag) {
    state.drag.x = ev.clientX - r.left - cv.clientWidth/2;
    state.drag.y = ev.clientY - r.top - cv.clientHeight/2;
  }
  cv.style.cursor = nodeAt(ev.clientX - r.left, ev.clientY - r.top) ? "pointer" : "default";
});
window.addEventListener("mouseup", ev => {
  const r = cv.getBoundingClientRect();
  const n = nodeAt(ev.clientX - r.left, ev.clientY - r.top);
  if (n && n === state.drag) { state.sel = n; showNode(n.id); }
  state.drag = null;
});

/* ---------- right panel ---------- */
async function showNode(id) {
  const d = await api("/api/node", { db: state.db, id });
  const edgeHtml = (e, dir) => {
    const other = dir === "out" ? e.target : e.source;
    const p = e.provenance;
    return `<div class="edge-row">
      ${dir === "out" ? "→" : "←"} <span class="rel">${e.relation}</span> ${short(other)}
      ${p ? `<div><a href="${p.url}" target="_blank" rel="noopener">${p.url}</a></div>
             <div class="when">${p.source} · ${(p.retrieved_at||"").slice(0,19)} · edge ${e.id.slice(0,8)}</div>`
          : `<div class="when">no provenance row</div>`}
    </div>`;
  };
  $("node").innerHTML = `<b>${d.node}</b>` +
    (d.outgoing.length + d.incoming.length
      ? d.outgoing.map(e => edgeHtml(e, "out")).join("") +
        d.incoming.map(e => edgeHtml(e, "in")).join("")
      : '<div class="empty">no edges</div>') +
    (d.tiles.length
      ? `<h2 style="margin-top:10px;font-size:11px;color:var(--dim)">PEEL TRACE TILES</h2>` +
        d.tiles.map(t => `<div class="tile">${t.emoji || ""} ${t.sentence}</div>`).join("")
      : "");
}

$("dbsel").onchange = ev => pick(ev.target.value);

/* ---------- tabs ---------- */
function showTab(name) {
  $("tab-graph").classList.toggle("active", name === "graph");
  $("tab-ledger").classList.toggle("active", name === "ledger");
  $("graphview").style.display = name === "graph" ? "" : "none";
  $("ledgerview").style.display = name === "ledger" ? "block" : "none";
  if (name === "ledger") runLedger(true);
}
$("tab-graph").onclick = () => showTab("graph");
$("tab-ledger").onclick = () => showTab("ledger");
if (location.hash === "#ledger")
  window.addEventListener("load", () => showTab("ledger"));

/* ---------- node search (also selects in the graph) ---------- */
$("nodesearch").addEventListener("change", ev => {
  const term = ev.target.value.trim().toLowerCase();
  if (!term) return;
  const hit = state.nodes.find(n => n.id.toLowerCase() === term) ||
              state.nodes.find(n => n.id.toLowerCase().includes(term));
  if (hit) { state.sel = hit; showTab("graph"); showNode(hit.id); }
  else $("node").innerHTML = `<span class="empty">no node matching “${ev.target.value}”</span>`;
});
const origStart = startGraph;
startGraph = function (g) {
  origStart(g);
  $("nodelist").innerHTML = g.nodes.map(n => `<option value="${n.id}">`).join("");
};

/* ---------- ledger ---------- */
const lstate = { offset: 0, limit: 200, kind: "", source: "", relation: "", total: 0 };
function lparams() {
  return { db: state.db, q: $("lq").value, from: $("lfrom").value,
    to: $("lto").value, kind: lstate.kind, source: lstate.source,
    relation: lstate.relation, limit: lstate.limit, offset: lstate.offset };
}
async function runLedger(reset) {
  if (!state.db) return;   // dbs not loaded yet; pick() re-triggers
  if (reset) { lstate.offset = 0; $("lrows").innerHTML = ""; }
  const d = await api("/api/ledger", lparams());
  lstate.total = d.total;
  renderFacets(d.facets);
  $("lcount").textContent =
    `${d.total} events — showing ${Math.min(d.offset + d.limit, d.total)}`;
  $("lrows").insertAdjacentHTML("beforeend", d.events.map(e => `
    <tr>
      <td class="when">${e.when ? e.when.replace("T", " ").slice(0, 19) : "—"}</td>
      <td><span class="kind kind-${e.kind}">${e.kind}</span></td>
      <td>${e.text}</td>
      <td>${e.url ? `<a href="${e.url}" target="_blank" rel="noopener">${e.url}</a>`
                  : (e.source || '<span class="empty">local</span>')}</td>
      <td class="when">${e.retrieved_at ? e.retrieved_at.slice(0, 19) : "—"}</td>
    </tr>`).join(""));
  $("lmore").style.display =
    d.offset + d.events.length < d.total ? "" : "none";
}
function chip(group, key, count) {
  const on = lstate[group] === key;
  return `<span class="chip ${on ? "on" : ""}" data-g="${group}" data-k="${key}">
    ${key} ${count}</span>`;
}
function renderFacets(f) {
  $("lfacets").innerHTML =
    Object.entries(f.kinds).map(([k, c]) => chip("kind", k, c)).join("") +
    Object.entries(f.sources).map(([k, c]) => chip("source", k, c)).join("") +
    Object.entries(f.relations).map(([k, c]) => chip("relation", k, c)).join("");
  document.querySelectorAll("#lfacets .chip").forEach(el => el.onclick = () => {
    const g = el.dataset.g, k = el.dataset.k;
    lstate[g] = lstate[g] === k ? "" : k;
    runLedger(true);
  });
}
$("lgo").onclick = () => runLedger(true);
$("lq").addEventListener("keydown", ev => { if (ev.key === "Enter") runLedger(true); });
$("lclear").onclick = () => {
  $("lq").value = ""; $("lfrom").value = ""; $("lto").value = "";
  lstate.kind = lstate.source = lstate.relation = "";
  runLedger(true);
};
$("lmore").onclick = () => { lstate.offset += lstate.limit; runLedger(false); };
const dl = fmt => {
  const p = new URLSearchParams({ ...lparams(), format: fmt, offset: 0 });
  window.open("/api/export?" + p, "_blank");
};
$("lcsv").onclick = () => dl("csv");
$("ljson").onclick = () => dl("json");

loadDbs();
</script>
</body>
</html>
